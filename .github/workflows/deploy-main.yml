name: Build and deploy Joynext

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: joynext-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/atlasfish/joynext-robot-part-store

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  image:
    name: Build container image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        id: meta
        shell: bash
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/joynext
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to private server
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Install pinned server host key
        run: |
          mkdir -p ~/.ssh
          install -m 600 deploy/known_hosts ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /root/joynext-deploy"
          sshpass -e scp \
            deploy/server/deploy.sh \
            deploy/nginx/joynext.location.inc \
            "$DEPLOY_USER@$DEPLOY_HOST:/root/joynext-deploy/"

      - name: Authenticate server to GHCR
        run: |
          printf '%s' "$GHCR_TOKEN" |
            sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Run blue-green deployment
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 /root/joynext-deploy/deploy.sh && /root/joynext-deploy/deploy.sh '$DEPLOY_IMAGE'"

      - name: Log server out of GHCR
        if: always()
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true

      - name: Verify public endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location \
              "https://www.atlasfish.work/joynext/" >/dev/null &&
              curl --fail --silent --show-error \
              "https://www.atlasfish.work/joynext/assets/brand/joynext-logo-dark.png" >/dev/null &&
              curl --fail --silent --show-error \
              "https://www.atlasfish.work/joynext/products/domain-controller.png" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1
